name: collaborate-coordination

# Coordinates AI agents from any platform (GitHub Apps, OAuth apps, or
# assistants acting under a user's account) through pull requests: each open PR
# is its agent's lease over the paths it changes, overlapping open PRs are lease
# conflicts, and approvals are checked for independence from the author.
#
# Security: pull_request_target runs with the base repository's token, so this
# workflow never checks out or executes pull request code. It builds the
# checker and reads .github/collaborate-agents.json from the default branch,
# and only reads PR metadata and comments through the GitHub API.
# Comment events refresh session membership without executing comment content.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: collaborate-coordination-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  coordinate:
    # Issue comments also fire for non-PR issues: ignore those entirely.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    name: coordinate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build checker
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/collaborate" ./cmd/collaborate
      - name: Check leases and review independence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          "$RUNNER_TEMP/collaborate" github-check \
            --pr "$PR_NUMBER" \
            --registry .github/collaborate-agents.json \
            --comment \
            --summary "$GITHUB_STEP_SUMMARY" > /dev/null
