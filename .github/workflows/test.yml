name: Go prototype tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # PR code runs in later steps; do not leave the read token in Git config.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Unit tests and race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Static analysis
        run: CGO_ENABLED=1 go vet ./...
      - name: Compile CLI
        run: CGO_ENABLED=1 go build ./cmd/collab
