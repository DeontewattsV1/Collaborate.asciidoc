name: opensandbox-sandbox

# Runs a command (default: the Go test suite) against any branch, tag or SHA
# inside a fresh, live OpenSandbox sandbox, then kills the sandbox.
#
# Setup (once): run scripts/setup_github_environments.sh, or in
# Settings > Environments > sandbox-opensandbox add
#   secret   OPEN_SANDBOX_API_KEY
#   variable OPEN_SANDBOX_DOMAIN    (your OpenSandbox server host[:port])
#   variable OPEN_SANDBOX_PROTOCOL  (optional, default https)
#
# Trust boundary: the runner only archives the selected ref; that code runs
# inside the remote sandbox, never on the runner. The runner script itself is
# always taken from trusted main, and the API key never enters the sandbox.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test
        required: true
        default: main
      command:
        description: Shell command run in the extracted source inside the sandbox
        required: true
        default: (command -v apt-get >/dev/null && apt-get update -qq && apt-get install -y -qq libsqlite3-dev >/dev/null || true) && go vet ./... && go test -count=1 ./...
      image:
        description: Sandbox container image
        required: true
        default: golang:1.26
      keep:
        description: Leave the sandbox running until its 30-minute lifetime ends
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opensandbox-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  sandbox:
    name: run-in-opensandbox
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: sandbox-opensandbox
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_KEY: ${{ secrets.OPEN_SANDBOX_API_KEY != '' }}
          DOMAIN: ${{ vars.OPEN_SANDBOX_DOMAIN }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$DOMAIN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="sandbox-opensandbox is not configured (needs secret OPEN_SANDBOX_API_KEY and variable OPEN_SANDBOX_DOMAIN). Nothing ran. Run scripts/setup_github_environments.sh."
            echo "::warning title=OpenSandbox not configured::$msg"
            echo "### OpenSandbox: not configured, nothing ran" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out trusted runner script (main)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out code under test (archived only, never executed here)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false
      - name: Archive the code under test
        if: steps.cfg.outputs.configured == 'true'
        run: |
          git -C target archive --format=tar.gz -o "$RUNNER_TEMP/src.tar.gz" HEAD
          echo "testing $(git -C target rev-parse HEAD) ($(du -h "$RUNNER_TEMP/src.tar.gz" | cut -f1))"
      - name: Set up Python
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned OpenSandbox SDK
        if: steps.cfg.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -q "opensandbox==1.2.1"
      - name: Run in live sandbox
        if: steps.cfg.outputs.configured == 'true'
        env:
          OPEN_SANDBOX_API_KEY: ${{ secrets.OPEN_SANDBOX_API_KEY }}
          OPEN_SANDBOX_DOMAIN: ${{ vars.OPEN_SANDBOX_DOMAIN }}
          OPEN_SANDBOX_PROTOCOL: ${{ vars.OPEN_SANDBOX_PROTOCOL }}
          SANDBOX_IMAGE: ${{ inputs.image }}
          SANDBOX_COMMAND: ${{ inputs.command }}
          SANDBOX_KEEP: ${{ inputs.keep }}
        run: |
          keep=()
          if [ "$SANDBOX_KEEP" = "true" ]; then keep=(--keep); fi
          python -I trusted/scripts/opensandbox_run.py \
            --archive "$RUNNER_TEMP/src.tar.gz" \
            --image "$SANDBOX_IMAGE" \
            --command "$SANDBOX_COMMAND" \
            "${keep[@]}"
