name: independent-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "manus/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-verify:
    name: go-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run scripts/check.sh (the same command agents run locally)
        run: scripts/check.sh
