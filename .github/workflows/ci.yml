name: independent-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "manus/**"
  workflow_dispatch:
    inputs:
      gemini_smoke:
        description: Run the free Gemini smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: independent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-verify:
    name: go-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable Postgres so the Postgres room-store, route-store and vault
    # contract tests run in CI instead of being skipped.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guild
          POSTGRES_PASSWORD: guild-ci-only
          POSTGRES_DB: guild_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guild -d guild_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      GUILD_TEST_DATABASE_URL: postgres://guild:guild-ci-only@localhost:5432/guild_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run scripts/check.sh (the same command agents run locally)
        run: scripts/check.sh
  gemini-smoke:
    name: gemini-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.gemini_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dev-guild/package-lock.json
      - name: Install Dev Guild dependencies
        working-directory: web/dev-guild
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ask Gemini for a non-empty reply
        working-directory: web/dev-guild
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: node scripts/gemini-smoke.mjs
