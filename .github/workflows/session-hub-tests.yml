name: session-hub-tests
on:
  pull_request:
    paths:
      - scripts/session_hub.py
      - tests/test_session_hub.py
      - .github/session-principals.json
      - .github/workflows/agent-collaboration.yml
      - .github/workflows/session-hub-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/session_hub.py
      - tests/test_session_hub.py
      - .github/session-principals.json
      - .github/workflows/agent-collaboration.yml
      - .github/workflows/session-hub-tests.yml
permissions:
  contents: read
jobs:
  session-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test authenticated session replay and fail-closed inputs
        run: python3 -m unittest discover -s tests -p 'test_session_hub.py' -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/session_hub.py
