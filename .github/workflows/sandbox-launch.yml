name: sandbox-launch

# Posts a Crafting Sandbox preview link on each new pull request.
# Configure once in repo Settings > Secrets and variables > Actions > Variables:
#   CRAFTING_TEMPLATE  - Crafting template name (required)
#   CRAFTING_CHECKOUTS - comma-separated workspace:path list (required)
#   CRAFTING_BASE_URL  - optional, defaults to https://sandboxes.cloud
# Until both required variables are set, the job is skipped.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Crafting preview link
    if: ${{ vars.CRAFTING_TEMPLATE != '' && vars.CRAFTING_CHECKOUTS != '' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate sandbox preview URL
        id: launch
        uses: crafting-dev/sandbox-launch-action@ca4ae80a848287f845072e5d03563a856d91632f # v0.5.3
        with:
          baseUrl: ${{ vars.CRAFTING_BASE_URL || 'https://sandboxes.cloud' }}
          template: ${{ vars.CRAFTING_TEMPLATE }}
          checkouts: ${{ vars.CRAFTING_CHECKOUTS }}
          mode: auto
      - name: Show preview URL
        run: echo "Sandbox preview ${{ steps.launch.outputs.url }}"
