name: render-sandbox

# Manually launches a short-lived Render sandbox for live agent communication
# demos (internal/broker + two signed agent identities), streams the live
# output, then terminates it (unless "keep" is ticked, in which case Render
# still auto-terminates it when timeoutSeconds expires).
#
# Setup (once): run scripts/setup_github_environments.sh, or in
# Settings > Environments > sandbox-render add
#   secret   RENDER_API_KEY
#   variable RENDER_WORKSPACE_ID      (optional, e.g. tea-...)
#   variable RENDER_SANDBOX_GROUP_ID  (optional, e.g. sbg-...)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Render sandbox plan (blank for default 1c-2g)
        required: false
        default: ''
      timeoutSeconds:
        description: Sandbox timeout in seconds (minimum 60; auto-terminates even when keep=true)
        required: false
        default: '300'
      keep:
        description: Leave the sandbox running until timeoutSeconds expires instead of terminating immediately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: sandbox-render
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_KEY: ${{ secrets.RENDER_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="sandbox-render has no RENDER_API_KEY secret. Nothing ran. Run scripts/setup_github_environments.sh."
            echo "::warning title=Render not configured::$msg"
            echo "### Render: not configured, nothing ran" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Render SDK
        if: steps.cfg.outputs.configured == 'true'
        working-directory: scripts/sandbox
        run: npm install --no-save --no-audit --no-fund @renderinc/sdk
      - name: Launch live agent demo sandbox
        if: steps.cfg.outputs.configured == 'true'
        working-directory: scripts/sandbox
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          SANDBOX_GROUP_ID: ${{ vars.RENDER_SANDBOX_GROUP_ID }}
          SANDBOX_PLAN: ${{ inputs.plan }}
          SANDBOX_TIMEOUT_SECONDS: ${{ inputs.timeoutSeconds }}
          SANDBOX_KEEP: ${{ inputs.keep }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node render-sandbox.mjs
