name: render-sandbox

# Manually launches a short-lived Render sandbox, prints its id and status,
# then terminates it (unless "keep" is ticked).
#
# Setup (once): run scripts/setup_github_environments.sh, or in
# Settings > Environments > sandbox-render add
#   secret   RENDER_API_KEY
#   variable RENDER_SANDBOX_GROUP_ID  (optional, e.g. sbg-...)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Render sandbox plan (blank for default)
        required: false
        default: ''
      timeoutSeconds:
        description: Sandbox timeout in seconds
        required: false
        default: '300'
      keep:
        description: Leave the sandbox running instead of terminating it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: sandbox-render
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_KEY: ${{ secrets.RENDER_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="sandbox-render has no RENDER_API_KEY secret. Nothing ran. Run scripts/setup_github_environments.sh."
            echo "::warning title=Render not configured::$msg"
            echo "### Render: not configured, nothing ran" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Render SDK
        if: steps.cfg.outputs.configured == 'true'
        working-directory: scripts/sandbox
        run: npm install --no-save --no-audit --no-fund @renderinc/sdk
      - name: Launch sandbox
        if: steps.cfg.outputs.configured == 'true'
        working-directory: scripts/sandbox
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SANDBOX_GROUP_ID: ${{ vars.RENDER_SANDBOX_GROUP_ID }}
          SANDBOX_PLAN: ${{ inputs.plan }}
          SANDBOX_TIMEOUT_SECONDS: ${{ inputs.timeoutSeconds }}
          SANDBOX_KEEP: ${{ inputs.keep }}
        run: |
          node render-sandbox.mjs
