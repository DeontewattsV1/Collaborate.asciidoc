name: GHCR cleanup

# Prunes old versions of this repository's container package, keeping the
# newest 10 images plus every image that still has a tag (main, latest,
# nightly, v* releases). Each image is deleted together with its platform and
# attestation manifests and its cosign `.sig`, so kept images stay pullable and
# verifiable. See .github/scripts/ghcr_cleanup.py.
#
# Deletion is permanent. Scheduled runs only print the plan until the
# repository variable GHCR_CLEANUP_ENABLED is set to `true`
# (Settings > Secrets and variables > Actions > Variables). A manual run deletes
# only when its `mode` input is set to `delete`.
#
# One-time setup: the package must grant this repository Admin access
# (package Settings > Manage Actions access), or the GITHUB_TOKEN cannot
# delete versions.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only prints the plan; delete removes versions permanently"
        type: choice
        options:
          - dry-run
          - delete
        default: dry-run
      keep:
        description: Number of newest images to keep (tagged images are always kept)
        type: string
        default: '10'

permissions:
  contents: read

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prune old package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: ${{ inputs.keep || '10' }}
          # Delete only on an explicit manual `delete`, or on schedule once enabled.
          DRY_RUN: ${{ !((github.event_name == 'workflow_dispatch' && inputs.mode == 'delete') || (github.event_name == 'schedule' && vars.GHCR_CLEANUP_ENABLED == 'true')) }}
        run: |
          if ! [[ "$KEEP" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::keep must be a whole number from 1 to 9999, got: '$KEEP'. Nothing was deleted."
            exit 2
          fi
          echo "Mode: $([ "$DRY_RUN" = "true" ] && echo dry-run || echo DELETE), keep newest $KEEP images"
          args=(--owner "$OWNER" --package "$PACKAGE" --keep "$KEEP")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 .github/scripts/ghcr_cleanup.py "${args[@]}"
