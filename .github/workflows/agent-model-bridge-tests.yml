name: agent-model-bridge-tests
on:
  pull_request:
    paths:
      - '.github/workflows/agent-model-bridge.yml'
      - '.github/workflows/agent-model-bridge-tests.yml'
      - 'scripts/agent_model_bridge.py'
      - 'tests/test_agent_model_bridge.py'
      - 'scripts/opensandbox_run.py'
      - 'tests/test_opensandbox_run.py'
      - '.github/workflows/opensandbox-sandbox.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-model-bridge.yml'
      - '.github/workflows/agent-model-bridge-tests.yml'
      - 'scripts/agent_model_bridge.py'
      - 'tests/test_agent_model_bridge.py'
      - 'scripts/opensandbox_run.py'
      - 'tests/test_opensandbox_run.py'
      - '.github/workflows/opensandbox-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-model-bridge-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted test branch WITHOUT credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Standard-library unit tests (no secrets / no provider calls)
        run: |
          python3 -m unittest discover -s tests -p 'test_agent_model_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_opensandbox_run.py' -v
      - name: Compile Python
        run: python3 -m py_compile scripts/agent_model_bridge.py scripts/opensandbox_run.py
      - name: Check setup script syntax
        run: bash -n scripts/setup_github_environments.sh
