name: agent-registry

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-registry:
    name: agent-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate agent registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: go run ./cmd/agent-registry-check --registry .github/agent-registry.json --event "$GITHUB_EVENT_PATH"
