name: locker-agents

# Runs the Git Locker assistant agents (agents/locker/index.json, 1,000 agents).
#   assist: the router picks a team of specialists, each writes a brief, the
#           primary model answers using the briefs, and a guardian reviews it.
#   run:    one agent; coordinators delegate recursively (bounded).
# Uses the same per-provider environments as agent-model-bridge
# (agent-openai, agent-anthropic, agent-gemini, agent-xai: MODEL_API_KEY secret,
# MODEL_NAME variable, optional ASSISTANT_MODEL_NAME for a cheaper assistant
# model). provider "mock" runs offline with no keys.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: assist (team briefs a primary model) or run (one agent)
        type: choice
        options: [assist, run]
        default: assist
      task:
        description: The task for the agents
        required: true
      agent:
        description: For mode=run, an agent name (e.g. lattice-agent-orchestrator) or number 1-1000
        required: false
        default: lattice-agent-orchestrator
      provider:
        description: Model provider (mock = offline, no keys)
        type: choice
        options: [anthropic, openai, gemini, xai, mock]
        default: anthropic
      assistants:
        description: For mode=assist, team size (1-8)
        default: '3'
      max_depth:
        description: Maximum delegation depth (0-3)
        default: '2'
      max_calls:
        description: Maximum model calls for the whole run (1-40)
        default: '12'

permissions:
  contents: read

concurrency:
  group: locker-agents-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  offline:
    name: run-offline (mock)
    if: inputs.provider == 'mock' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run agents
        env:
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
          AGENT: ${{ inputs.agent }}
          ASSISTANTS: ${{ inputs.assistants }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: scripts/run_locker_agents.sh mock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locker-agents-trace
          path: ${{ runner.temp }}/locker-trace.json
          retention-days: 14
          if-no-files-found: ignore

  live:
    name: run-${{ inputs.provider }}
    if: inputs.provider != 'mock' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: agent-${{ inputs.provider }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_KEY: ${{ secrets.MODEL_API_KEY != '' }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$MODEL_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="agent-$PROVIDER needs a MODEL_API_KEY secret and a MODEL_NAME variable. Nothing ran. Run scripts/setup_github_environments.sh, or choose provider 'mock'."
            echo "::warning title=$PROVIDER not configured::$msg"
            { echo "### Git Locker agents: not configured, nothing ran"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run agents
        if: steps.cfg.outputs.configured == 'true'
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          ASSISTANT_MODEL_NAME: ${{ vars.ASSISTANT_MODEL_NAME }}
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
          AGENT: ${{ inputs.agent }}
          ASSISTANTS: ${{ inputs.assistants }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          MAX_CALLS: ${{ inputs.max_calls }}
          PROVIDER: ${{ inputs.provider }}
        run: scripts/run_locker_agents.sh "$PROVIDER"
      - if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locker-agents-trace
          path: ${{ runner.temp }}/locker-trace.json
          retention-days: 14
          if-no-files-found: ignore
