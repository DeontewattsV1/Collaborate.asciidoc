name: Bug Report
description: Report unexpected behavior in collaborate, collab, agentterm, sandboxes, or CI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. **Do not paste API keys, GitHub tokens, SSH private keys, or `.collab/` / `.agentterm/` private keys.**
        For security vulnerabilities, use [GitHub Security Advisories](https://github.com/DeontewattsV1/Collaborate.asciidoc/security/advisories/new) instead of a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - cmd/collaborate (Ed25519 broker / MCP / adapters)
        - cmd/collab (shared-token pilot)
        - cmd/agentterm (shared verifiable terminal / web UI)
        - cmd/agent-registry-check / coordinate check
        - Git Locker assistant agents (scripts/locker_agents.py)
        - Sandboxes (Codespaces / Oracle / GCP / OpenSandbox / Render)
        - GitHub Actions / scripts/check.sh
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. Observe '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and verification output
      description: OS, Go version (`go version`), Python version, commit SHA, and output of `scripts/check.sh --quick` if applicable.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I confirmed this report contains no secrets, tokens, private keys, or private host credentials.
          required: true
