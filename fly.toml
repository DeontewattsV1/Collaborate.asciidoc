# collaborate-asciidoc on Fly.io (iad).
# One shared-cpu-1x machine serves the Next.js web app and the agent
# terminal. Do not add machines, volumes, dedicated IPv4, or managed
# Postgres: those all create a bill. Deploy with:
#   flyctl deploy --ha=false --update-only --yes -a collaborate-asciidoc
#
# See fly/README.md for cost notes and rollback.

app = 'collaborate-asciidoc'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOSTNAME = '127.0.0.1'
  NODE_OPTIONS = '--max-old-space-size=96'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
