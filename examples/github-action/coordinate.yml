# Example: copy to .github/workflows/collaborate-check.yml in your repository.
#
# Pinned to the published v1.0.0 release by its full commit SHA. When you
# upgrade, replace both the SHA and the tag comment with a reviewed release.
# Pin by full SHA, never by a moving tag or branch.
#
# pull_request_target runs with your repository's token, which is why this
# workflow never checks out the pull request: the action reads PR metadata
# through the API only.
name: Collaborate Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write
  # statuses: write   # uncomment together with set-status: "true"

concurrency:
  group: collaborate-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: DeontewattsV1/Collaborate.asciidoc@0348acdda4c98d3892dd6b79467a240c4daeb0cd # v1.0.0
        with:
          comment: "true"
          reconcile: "true"
          # set-status: "true"        # make collaborate/coordination a required status
          # fail-on-indeterminate: "true"
