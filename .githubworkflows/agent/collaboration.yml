python3 - <<'PY'
from pathlib import Path
from zipfile import ZipFile
import hashlib

archive = Path("collaborate-agent-bridge.zip")

files = {
    ".github/workflows/agent-model-bridge.yml":
        "78b314141225e9f105bbe563e0e766355a4068e2a435fc270c587dc42ec94daf",
    ".github/workflows/agent-model-bridge-tests.yml":
        "e3bc6daacdf9810324eb0622e4dfd2e14a8ca4e21b00f556307d62f4c4da71a9",
    "scripts/agent_model_bridge.py":
        "df2252612d12f3a836a0f3b566aee399fae98ec94cd05e40e7bbb91dba49fcc8",
    "tests/test_agent_model_bridge.py":
        "52910b36f0ddf06909421715cce075b2d16a28b4f5560c621fd6912c823e49e3",
    "docs/AGENT-MODEL-BRIDGE.md":
        "82c8184cce22fe012d4975f43f34a1d35bdace18d64d234c2c7fe1b707da84b1",
}

with ZipFile(archive) as z:
    verified = {}

    for name, expected in files.items():
        content = z.read(name)
        actual = hashlib.sha256(content).hexdigest()

        if actual != expected:
            raise SystemExit(f"CHECKSUM FAILED: {name}")

        dest = Path(name)
        if dest.exists() and dest.read_bytes() != content:
            raise SystemExit(f"EXISTING FILE DIFFERS: {name}")

        verified[name] = content

    for name, content in verified.items():
        dest = Path(name)
        dest.parent.mkdir(parents=True, exist_ok=True)
        dest.write_bytes(content)
        print(f"Verified and installed: {name}")

print("Installation file verification: PASS")
PY

# Run offline verification.
